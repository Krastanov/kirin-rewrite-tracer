site_name: Kirin Rewrite Tracer
site_description: Trace Kirin rewrites and inspect them in a self-contained HTML viewer.
site_url: https://krastanov.github.io/kirin-rewrite-tracer/
repo_name: Krastanov/kirin-rewrite-tracer
repo_url: https://github.com/Krastanov/kirin-rewrite-tracer
edit_uri: edit/main/docs/

hooks:
  - scripts/render_docs_examples.py

nav:
  - Home: index.md
  - Examples: examples.md
  - API reference: api.md

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

plugins:
  - search

copyright: Copyright &copy; Kirin Rewrite Tracer contributors
